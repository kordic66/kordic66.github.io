<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theoretical Materials</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to CSS file for styles -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s, color 0.5s;
        }

        /* Light theme */
        .light-theme {
            background-color: #ffffff;
            color: #000000;
        }

        /* Dark theme */
        .dark-theme {
            background-color: #121212;
            color: #ffffff;
        }

        nav {
            padding: 1rem;
            background-color: #333;
            color: white;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        .toggle-theme {
            cursor: pointer;
            background-color: #555;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .card {
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
    </style>
</head>
<body class="light-theme">
    <nav>
        <a href="index.html">Home</a>
